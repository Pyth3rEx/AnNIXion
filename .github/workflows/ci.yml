name: CI

on:
  # Validation (the `check` job) runs on every PR, whatever the target branch.
  pull_request:
  # Pushes only matter on main (system closure + ISO release).
  push:
    branches: [main]

# Read-only floor for every job. Build ISO raises its own to publish a release;
# nothing else writes, so nothing else declares more.
permissions:
  contents: read

jobs:
  # Lint is its own job so it reports separately from the build and finishes in
  # about a minute, rather than waiting behind the closure build.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # The base revision, linted separately so the summary can report what
      # this branch changes rather than only where it stands.
      - name: Check out the base revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .lint-base

      # Runs before Nix is installed: a rejected lock must never be fetched.
      - name: Guard flake inputs
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/check-flake-inputs.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # Output is dropped: its annotations would point at the base revision.
      # A base that does not lint cleanly must not fail this branch either.
      - name: "[L0] Baseline"
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          LINT_COUNTS: ${{ runner.temp }}/base-counts.txt
        run: nix develop --command bash .lint-base/.github/scripts/lint.sh >/dev/null

      # Same tools the dev shell gives a contributor locally.
      - name: "[L0] Lint"
        env:
          LINT_SUMMARY: ${{ runner.temp }}/lint-summary.md
          LINT_BASELINE: ${{ runner.temp }}/base-counts.txt
        run: nix develop --command bash .github/scripts/lint.sh

      - name: "[L0] Script tests"
        run: |
          nix develop --command bash tests/milestone.sh
          nix develop --command bash tests/prompt-width.sh
          nix develop --command bash tests/firefox-profiles.sh
          nix develop --command bash tests/workflow-injection.sh
          nix develop --command bash tests/workflow-permissions.sh
          nix develop --command bash tests/stale-reviews.sh

      # Uploaded even when linting failed — that is when the summary matters
      # most. pr-summary.yml posts it, holding the token a fork PR cannot get.
      - name: Upload the lint summary
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lint-summary
          path: ${{ runner.temp }}/lint-summary.md
          if-no-files-found: ignore

  check:
    name: Nix CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # hardware-configuration.nix is machine-specific and must never be
      # committed (it is gitignored). Reject any PR that force-adds it so a
      # contributor's disk layout can't leak into the flake.
      - name: Reject committed hardware configuration
        if: github.event_name == 'pull_request'
        run: |
          if git ls-files --error-unmatch hardware-configuration.nix >/dev/null 2>&1; then
            echo "::error file=hardware-configuration.nix::hardware-configuration.nix is machine-specific and must not be committed. Remove it from this PR with 'git rm --cached hardware-configuration.nix' (it stays gitignored)."
            exit 1
          fi
          echo "hardware-configuration.nix is not tracked ✓"

      # Required for nixosTest to run QEMU VMs at acceptable speed
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      # L1 — flake evaluation: catches syntax errors, bad option types,
      # undefined references. --no-build keeps this step fast.
      - name: "[L1] Flake evaluation"
        run: nix flake check --no-build

      # L2 — full system closure: proves every package in the config
      # resolves and all modules compose without conflicts.
      # AnNIXion-ci is the real config with ci/hardware-stub.nix as its disk
      # layout — the only part CI cannot know.
      - name: "[L2] System closure build"
        run: |
          nix build .#nixosConfigurations.AnNIXion-ci.config.system.build.toplevel \
            --print-build-logs --no-link

      # L3 — VM tests: boot + service behaviour, security tool presence.
      # Runs in QEMU via the NixOS test framework.
      # Every check the flake defines, discovered rather than listed: a test
      # that is written and wired in must not be able to never run.
      - name: "[L3] VM tests"
        run: |
          mapfile -t checks < <(nix eval --json '.#checks.x86_64-linux' \
            --apply builtins.attrNames | jq -r '.[]')
          printf 'running %s VM test(s): %s\n' "${#checks[@]}" "${checks[*]}"
          nix build "${checks[@]/#/.#checks.x86_64-linux.}" \
            --print-build-logs --no-link

  iso:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: check
    # Main-specific: only build/publish the ISO for PRs into main or
    # pushes to main. PRs into other branches (e.g. dev) skip this.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require version bump (PR)
        if: github.event_name == 'pull_request'
        env:
          # The PR's target branch (e.g. "main"), passed via env to avoid
          # interpolating untrusted context straight into the shell.
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Read VERSION from the target branch. A plain `git show
          # origin/main:VERSION` is unreliable on a PR runner: checkout only
          # fetches the PR merge ref, so origin/main may be absent and the
          # comparison would silently pass. Fetch the base branch explicitly
          # and read it from FETCH_HEAD.
          git fetch --depth=1 origin "$BASE_REF"
          BASE_VERSION=$(git show FETCH_HEAD:VERSION 2>/dev/null || echo "")
          CURRENT_VERSION=$(cat VERSION)
          if [ -z "$BASE_VERSION" ]; then
            echo "::error file=VERSION::Could not read VERSION from ${BASE_REF} — cannot verify the bump."
            exit 1
          fi
          if [ -z "$CURRENT_VERSION" ]; then
            echo "::error file=VERSION::VERSION file is empty."
            exit 1
          fi
          if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then
            echo "::error file=VERSION::VERSION is still ${CURRENT_VERSION} — bump it before merging."
            echo "::error file=VERSION::  patch → x.y.Z   minor → x.Y.0   major → X.0.0"
            exit 1
          fi
          echo "Version bumped: ${BASE_VERSION} → ${CURRENT_VERSION}"

      - name: Require release name (PR)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Every release carries its own codename. Read the base branch's name
          # the same way the version gate does; a missing one is fine (the first
          # release to use this), a reused one is not.
          git fetch --depth=1 origin "$BASE_REF"
          BASE_NAME=$(git show FETCH_HEAD:RELEASE_NAME 2>/dev/null || echo "")
          if [ ! -f RELEASE_NAME ]; then
            echo "::error file=RELEASE_NAME::RELEASE_NAME is missing — name this release before merging."
            exit 1
          fi
          CURRENT_NAME=$(head -1 RELEASE_NAME | tr -d '\r')
          if [ -z "$CURRENT_NAME" ]; then
            echo "::error file=RELEASE_NAME::RELEASE_NAME is empty — name this release before merging."
            exit 1
          fi
          if [ "$(wc -l < RELEASE_NAME)" -gt 1 ]; then
            echo "::error file=RELEASE_NAME::RELEASE_NAME must be a single line."
            exit 1
          fi
          # Short and punchy: the name shares a release title with the version.
          if [ "${#CURRENT_NAME}" -gt 24 ]; then
            echo "::error file=RELEASE_NAME::\"${CURRENT_NAME}\" is ${#CURRENT_NAME} characters — keep it under 24."
            exit 1
          fi
          if [ "$BASE_NAME" = "$CURRENT_NAME" ]; then
            echo "::error file=RELEASE_NAME::RELEASE_NAME is still \"${CURRENT_NAME}\" — give this release its own name."
            exit 1
          fi
          echo "Release name: ${CURRENT_NAME}"

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build ISO
        run: |
          nix build .#packages.x86_64-linux.iso \
            --print-build-logs \
            --out-link result-iso

      - name: Locate ISO
        id: iso
        run: |
          ISO=$(find result-iso/ -name "*.iso" -type f | head -1)
          if [ -z "$ISO" ]; then
            echo "::error file=iso.nix::No .iso file found under result-iso/. Build may have failed silently."
            echo "Directory contents:"
            find result-iso/ -type f || echo "(empty)"
            exit 1
          fi
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          echo "Found ISO: $ISO ($(du -sh "$ISO" | cut -f1))"

      - name: Check ISO size
        env:
          ISO_PATH: ${{ steps.iso.outputs.path }}
        run: |
          ISO="$ISO_PATH"
          MAX_MB=1900
          MAX_BYTES=$((MAX_MB * 1024 * 1024))
          ISO_BYTES=$(stat -c%s "$ISO")
          ISO_MB=$((ISO_BYTES / 1024 / 1024))
          if [ "$ISO_BYTES" -gt "$MAX_BYTES" ]; then
            echo "::error file=iso.nix::ISO is ${ISO_MB} MB — exceeds the ${MAX_MB} MB GitHub release limit. Remove packages from iso.nix to reduce size."
            exit 1
          fi
          echo "ISO size: ${ISO_MB} MB / ${MAX_MB} MB limit ✓"

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "number=${VERSION}" >> "$GITHUB_OUTPUT"
          # Releases before RELEASE_NAME existed have no codename; fall back to
          # the bare version rather than publishing a title with a dangling dash.
          NAME=$(head -1 RELEASE_NAME 2>/dev/null | tr -d '\r' || echo "")
          if [ -n "$NAME" ]; then
            echo "title=AnNIXion ${VERSION} — ${NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "title=AnNIXion ${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      # On PRs: upload as a downloadable artifact so you can test the ISO
      # before merging. Find it under Actions → your run → Artifacts.
      - name: Upload ISO artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AnNIXion-${{ steps.version.outputs.tag }}
          path: ${{ steps.iso.outputs.path }}
          retention-days: 7

      # On merge to main: read the merged PR body as the changelog, then
      # publish a GitHub Release. Skipped if this tag already exists.
      - name: Read PR changelog
        id: changelog
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          BODY=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].body // ""')
          if [ -z "$BODY" ]; then
            BODY="_No changelog provided._"
            echo "::warning::No merged PR found for this commit — release notes will be empty."
          fi
          # Random delimiter: a body containing the marker would otherwise be
          # able to close the heredoc and write further outputs of its own.
          DELIM="body_$(openssl rand -hex 16)"
          {
            printf 'body<<%s\n' "$DELIM"
            printf '%s\n' "$BODY"
            printf '%s\n' "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TAG: ${{ steps.version.outputs.tag }}
          TITLE: ${{ steps.version.outputs.title }}
          ISO_PATH: ${{ steps.iso.outputs.path }}
          # Via env, never interpolated into the shell, exactly as pr-form.yml
          # takes the body: ${{ }} is pasted in before bash runs, so backticks
          # in a changelog would be command substitution rather than markup.
          CHANGELOG: ${{ steps.changelog.outputs.body }}
        run: |

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists — bump VERSION to publish a new release."
            exit 0
          fi

          # Auto-generated PR list since the previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -1)
          AUTO_NOTES=$(gh api "repos/$REPO/releases/generate-notes" \
            -X POST \
            -f tag_name="$TAG" \
            ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} \
            --jq '.body' 2>/dev/null || echo "")

          NOTES_FILE=$(mktemp)
          {
            printf '%s\n' "$CHANGELOG"
            if [ -n "$AUTO_NOTES" ]; then
              printf '\n---\n\n## All changes in this release\n\n%s\n' "$AUTO_NOTES"
            fi
            printf '\n---\n\n**Live credentials:** `operator` / `operator`\n'
            printf 'Flash the ISO with Rufus (Windows) or `dd` (Linux/macOS), boot, run `annixion-install`.\n'
            printf 'Built from commit `%s`.\n' "$COMMIT_SHA"
          } > "$NOTES_FILE"

          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            "$ISO_PATH"
