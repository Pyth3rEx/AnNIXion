name: Project

# Keeps the project board in step with issues and pull requests.
#
#   issue opened          → Backlog, labelled for triage, milestone assigned
#   triage label removed  → Ready, or Up next when it is on the next release
#   milestone changed     → Up next or Ready, for work nobody has started
#   issue assigned        → In progress
#   PR opened             → In progress, milestone assigned — Ready while a draft
#   PR draft state moved  → Ready as a draft, In progress once ready for review
#   PR closed unmerged    → Done; it is not coming back
#   PR merged into dev    → In review, with the issues it closes
#   PR merged into main   → Done, with everything else in review
#   milestone closed      → the next release's Ready work rises to Up next
#
# Ready and Up next split triaged work by release: the nearest open milestone
# is the one being built, everything further out waits in Ready.
#
# pull_request_target runs in the base repository so the project token is
# available on pull requests from forks. No step checks out or runs PR code —
# these jobs only call the API — so that exposure is deliberate and contained.

on:
  issues:
    types: [opened, assigned, unlabeled, milestoned, demilestoned]
  pull_request_target:
    types:
      [opened, closed, milestoned, demilestoned, ready_for_review, converted_to_draft]
  milestone:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PROJECT_OWNER: Pyth3rEx
  PROJECT_NUMBER: "3"
  TRIAGE_LABEL: needs triage

jobs:
  # ── New issue ─────────────────────────────────────────────────────────
  issue-opened:
    name: Issue opened
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Flag for triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --add-label "$TRIAGE_LABEL"

      - name: Assign the furthest milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          HAS_MILESTONE: ${{ github.event.issue.milestone != null }}
        run: .github/scripts/assign-milestone.sh

      - name: Read priority and size from the form
        id: form
        env:
          BODY: ${{ github.event.issue.body }}
        run: .github/scripts/parse-form-fields.py >> "$GITHUB_OUTPUT"

      - name: Add to the board
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          .github/scripts/project-sync.sh sync \
            --content "${{ github.event.issue.node_id }}" \
            --status Backlog \
            ${{ steps.form.outputs.priority && format('--priority {0}', steps.form.outputs.priority) }} \
            ${{ steps.form.outputs.size && format('--size {0}', steps.form.outputs.size) }} \
            --only-if-empty

  # ── Triaged ───────────────────────────────────────────────────────────
  issue-triaged:
    name: Issue triaged
    if: >-
      github.event_name == 'issues' && github.event.action == 'unlabeled'
      && github.event.label.name == 'needs triage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read the column its milestone implies
        id: column
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE: ${{ github.event.issue.milestone.title }}
        run: echo "status=$(.github/scripts/board-status.sh "$MILESTONE")" >> "$GITHUB_OUTPUT"

      - name: Move out of Backlog
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          STATUS: ${{ steps.column.outputs.status }}
        # Guarded: an issue already being worked on must not be pulled back.
        run: |
          .github/scripts/project-sync.sh sync \
            --content "${{ github.event.issue.node_id }}" \
            --status "$STATUS" --only-if-status Backlog

  # ── Milestone changed ─────────────────────────────────────────────────
  milestone-changed:
    name: Milestone changed
    if: github.event.action == 'milestoned' || github.event.action == 'demilestoned'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read the column its milestone implies
        id: column
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MILESTONE: ${{ github.event.issue.milestone.title || github.event.pull_request.milestone.title }}
        run: echo "status=$(.github/scripts/board-status.sh "$MILESTONE")" >> "$GITHUB_OUTPUT"

      - name: Move between Ready and Up next
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          STATUS: ${{ steps.column.outputs.status }}
        # Guarded to the two columns ahead of the work, so scoping something
        # into a release never drags back what is already underway or shipped.
        # A new issue is still in Backlog when its milestone lands, so triage
        # stays the only way out of Backlog.
        run: |
          .github/scripts/project-sync.sh sync \
            --content "${{ github.event.issue.node_id || github.event.pull_request.node_id }}" \
            --status "$STATUS" --only-if-status "Ready,Up next"

  # ── Assigned ──────────────────────────────────────────────────────────
  issue-assigned:
    name: Issue assigned
    if: github.event_name == 'issues' && github.event.action == 'assigned'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Move to In progress
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
        run: |
          .github/scripts/project-sync.sh sync \
            --content "${{ github.event.issue.node_id }}" \
            --status "In progress"

  # ── New pull request ──────────────────────────────────────────────────
  pr-opened:
    name: Pull request opened
    if: github.event_name == 'pull_request_target' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Assign the furthest milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.pull_request.number }}
          HAS_MILESTONE: ${{ github.event.pull_request.milestone != null }}
        run: .github/scripts/assign-milestone.sh

  # ── Where a pull request sits while it is open ────────────────────────
  # One job for every state a pull request reaches on its own: opened, moved
  # in or out of draft, or closed without merging. The merge jobs below own
  # the rest, because they also have to move the issues the PR closes.
  pr-column:
    name: Pull request column
    if: >-
      github.event_name == 'pull_request_target'
      && (
        github.event.action == 'opened'
        || github.event.action == 'ready_for_review'
        || github.event.action == 'converted_to_draft'
        || (github.event.action == 'closed' && github.event.pull_request.merged == false)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read the column this pull request belongs in
        id: column
        env:
          ACTION: ${{ github.event.action }}
          DRAFT: ${{ github.event.pull_request.draft }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: echo "status=$(.github/scripts/pr-column.sh)" >> "$GITHUB_OUTPUT"

      - name: Put it there
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          STATUS: ${{ steps.column.outputs.status }}
        run: |
          .github/scripts/project-sync.sh sync \
            --content "${{ github.event.pull_request.node_id }}" \
            --status "$STATUS"

  # ── Merged into dev ───────────────────────────────────────────────────
  pr-merged-dev:
    name: Merged into dev
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find the issues this pull request closes
        id: closes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "ids=$(.github/scripts/closing-issues.sh "$PR_NUMBER" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Move the pull request and its issues to In review
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
          ISSUE_IDS: ${{ steps.closes.outputs.ids }}
        run: |
          .github/scripts/project-sync.sh sync --content "$PR_NODE" --status "In review"
          for issue in $ISSUE_IDS; do
            .github/scripts/project-sync.sh sync --content "$issue" --status "In review"
          done

  # ── Merged into main ──────────────────────────────────────────────────
  pr-merged-main:
    name: Merged into main
    if: >-
      github.event_name == 'pull_request_target' && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Find the issues this pull request closes
        id: closes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "ids=$(.github/scripts/closing-issues.sh "$PR_NUMBER" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Move everything released to Done
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
          ISSUE_IDS: ${{ steps.closes.outputs.ids }}
        # A release PR closes the issues its feature PRs referenced, so the
        # sweep is what actually retires the work: everything that reached
        # dev is in review, and merging to main ships it.
        run: |
          .github/scripts/project-sync.sh sync --content "$PR_NODE" --status Done
          for issue in $ISSUE_IDS; do
            .github/scripts/project-sync.sh sync --content "$issue" --status Done
          done
          .github/scripts/project-sync.sh sweep --from "In review" --to Done

      - name: Read the upcoming release
        id: upcoming
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "milestone=$(.github/scripts/assign-milestone.sh --nearest)" >> "$GITHUB_OUTPUT"

      - name: Scope its Ready work into Up next
        if: steps.upcoming.outputs.milestone != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          MILESTONE: ${{ steps.upcoming.outputs.milestone }}
        run: |
          .github/scripts/project-sync.sh sweep \
            --from Ready --to "Up next" --milestone "$MILESTONE"

  # ── Milestone closed ──────────────────────────────────────────────────
  # Closing the shipped milestone is what makes the next one upcoming, so this
  # is the moment its Ready work becomes the release being built. Merging into
  # main runs the same sweep, for when the milestone is closed first.
  milestone-closed:
    name: Milestone closed
    if: github.event_name == 'milestone' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Read the upcoming release
        id: upcoming
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "milestone=$(.github/scripts/assign-milestone.sh --nearest)" >> "$GITHUB_OUTPUT"

      - name: Scope its Ready work into Up next
        if: steps.upcoming.outputs.milestone != ''
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          MILESTONE: ${{ steps.upcoming.outputs.milestone }}
        run: |
          .github/scripts/project-sync.sh sweep \
            --from Ready --to "Up next" --milestone "$MILESTONE"
