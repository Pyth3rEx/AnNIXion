name: Tool Request
description: Request a security tool, OSINT utility, or SDR package to be added to AnNIXion.
title: "[Tool]: "
labels: ["tool request"]
body:
  - type: markdown
    attributes:
      value: |
        Check [nixpkgs search](https://search.nixos.org/packages) before filing — if the tool is in nixpkgs, adding it is usually a one-liner.

  - type: input
    id: tool_name
    attributes:
      label: Tool name
      placeholder: crackmapexec
    validations:
      required: true

  - type: input
    id: nixpkgs
    attributes:
      label: nixpkgs package name (if known)
      placeholder: "crackmapexec  or  not in nixpkgs"
    validations:
      required: false

  - type: input
    id: upstream
    attributes:
      label: Upstream URL
      placeholder: https://github.com/...
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What does this tool do and which operator workflow does it support?
      placeholder: |
        CrackMapExec is a post-exploitation tool for Windows/AD environments. It belongs in 07. Post-Exploitation — Lateral Movement alongside impacket for lateral movement and credential testing.
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Matches the kill-chain menu structure in the AnNIXion app launcher.
      options:
        - 01. Reconnaissance — Passive OSINT
        - 01. Reconnaissance — Active Scanning
        - 01. Reconnaissance — RF / Signal Intel
        - 02. Weaponization — Disassembly
        - 02. Weaponization — Firmware Analysis
        - 03. Delivery — Web Proxy
        - 03. Delivery — Web Injection
        - 04. Exploitation — Frameworks
        - 04. Exploitation — Credential Attacks
        - 04. Exploitation — Wireless
        - 05. Installation — Tunneling & Shells
        - 06. C2 — Frameworks
        - 07. Post-Exploitation — Lateral Movement
        - 08. Forensics — Memory Analysis
        - 08. Forensics — Disk Analysis
        - 09. Reverse Engineering — Disassemblers
        - 09. Reverse Engineering — Firmware
        - 10. Sniffing & Analysis
        - Tools — Internet
        - Tools — Development
        - Tools — Utilities
        - Tools — Productivity
        - System
        - Other
    validations:
      required: true

  - type: dropdown
    id: nixpkgs_status
    attributes:
      label: nixpkgs availability
      options:
        - In nixpkgs — stable channel
        - In nixpkgs — unstable only
        - Not in nixpkgs — needs a custom derivation
        - Not in nixpkgs — available as a flake
        - Unknown
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Packaging notes
      description: Known build issues, required patches, unfree license, or runtime dependencies worth calling out.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How urgent is this from where you sit? The maintainer may adjust it.
      options:
        - P0 — blocks installing, booting or an engagement, with no workaround
        - P1 — a core workflow is broken or badly degraded
        - P2 — annoyance, cosmetic, or nice to have
    validations:
      required: true

  - type: dropdown
    id: size
    attributes:
      label: Size
      description: Your guess at the work involved. The maintainer may adjust it.
      options:
        - XS — a line or two
        - S — a single file
        - M — a new module, or several files
        - L — cross-module work, or a new flake input
        - XL — a phase of its own
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this tool has not already been requested.
          required: true
        - label: I have a legitimate offensive security, OSINT, or research use case for this tool.
          required: true
